<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordring 英単語帳</title>
<meta name="description" content="自分で単語を登録して、暗記カードと4択テストで覚える英単語帳">
<meta name="theme-color" content="#1d2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wordring">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Wordring</h1><span>英単語帳</span></div>
    <div class="account-row"><div class="sync" id="sync"><i></i><span>読み込み中…</span></div><div id="account"></div></div>
  </header>

  <div class="bookbar" id="bookbar"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-list" aria-selected="true" data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>単語</button>
    <button role="tab" id="tab-study" aria-selected="false" data-view="study">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="15" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg>カード</button>
    <button role="tab" id="tab-quiz" aria-selected="false" data-view="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>テスト</button>
  </nav>

  <!-- LIST -->
  <section id="view-list" class="wrap">
    <div id="plan-host"></div>
    <div class="stats">
      <div class="stat"><b id="st-total">0</b><span>登録した単語</span></div>
      <div class="stat"><b id="st-en">0</b><span>英→日 覚えた <em id="st-en-pct">0%</em></span><div class="meter"><div id="st-en-bar"></div></div></div>
      <div class="stat"><b id="st-ja">0</b><span>日→英 覚えた <em id="st-ja-pct">0%</em></span><div class="meter"><div id="st-ja-bar"></div></div></div>
    </div>

    <form class="add" id="add-form" autocomplete="off">
      <h2>単語を追加</h2>
      <div class="row">
        <label class="f">英単語<input type="text" class="en" id="in-en" placeholder="e.g. resilient" autocapitalize="off" spellcheck="false" required></label>
        <label class="f">意味<input type="text" id="in-ja" placeholder="例: 回復力のある" required></label>
      </div>
      <div class="row" id="more-fields" hidden>
        <label class="f">例文（任意）<input type="text" id="in-ex" placeholder="She is resilient under pressure."></label>
        <label class="f">タグ（任意）<input type="text" id="in-tag" placeholder="例: TOEIC, 第3章"></label>
      </div>
      <div class="actions">
        <button class="btn primary" type="submit">追加する</button>
        <button class="link" type="button" id="toggle-more">例文・タグも入力</button>
        <span style="flex:1"></span>
        <button class="link" type="button" id="open-import">まとめて追加</button>
      </div>
      <div class="msg" id="add-msg" aria-live="polite"></div>
    </form>

    <div class="toolbar">
      <input type="search" id="q" placeholder="単語・意味で検索">
      <select id="f-tag" aria-label="タグで絞り込み"><option value="">すべてのタグ</option></select>
      <button class="chip" id="sheet-btn" aria-pressed="false" title="意味を赤シートで隠す">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>赤シート</button>
    </div>

    <div id="list-host"></div>
  </section>

  <!-- STUDY -->
  <section id="view-study" class="wrap" hidden>
    <div class="study-opts">
      <div class="seg" id="study-dir">
        <button aria-pressed="true" data-v="en">英 → 日</button>
        <button aria-pressed="false" data-v="ja">日 → 英</button>
      </div>
      <div class="seg" id="study-set">
        <button aria-pressed="false" data-v="today">今日の分</button>
        <button aria-pressed="true" data-v="todo">まだの単語</button>
        <button aria-pressed="false" data-v="all">すべて</button>
      </div>
    </div>
    <div class="plan-mini" id="study-plan" hidden></div>
    <div id="study-host"></div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" class="wrap" hidden>
    <div class="study-opts">
      <div class="seg" id="quiz-dir">
        <button aria-pressed="true" data-v="en">英 → 日</button>
        <button aria-pressed="false" data-v="ja">日 → 英</button>
      </div>
      <div class="seg" id="quiz-set">
        <button aria-pressed="false" data-v="today">今日の分</button>
        <button aria-pressed="true" data-v="all">本全体から</button>
      </div>
    </div>
    <div class="count-row" id="quiz-count"></div>
    <div class="plan-mini" id="quiz-plan" hidden></div>
    <div id="quiz-host"></div>
  </section>
</div>

<div id="dlg-host"></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
